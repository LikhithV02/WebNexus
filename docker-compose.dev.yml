version: '3.8'

# Development configuration with hot-reloading and volume mounts

services:
  webnexus-api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webnexus-api-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount code for hot-reloading
      - ./webnexus:/app/webnexus:ro
      - ./scripts:/app/scripts:ro
      # Persist data
      - webnexus-dev-data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/db/webnexus.db
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=DEBUG
      - DEBUG=true
    command: ["uvicorn", "webnexus.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    networks:
      - webnexus-dev-network

volumes:
  webnexus-dev-data:
    driver: local

networks:
  webnexus-dev-network:
    driver: bridge
